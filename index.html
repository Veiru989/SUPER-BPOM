function startCart(){const ks=shuf(TAB),it=[];EZ=0;for(let i=0;i<6;i++){const bad=i<2,k=bad?ks[i]:pk(TAB);it.push({p:mkProd(pk(ALLP),bad?k:null,1,Math.random()<.3?[k]:[],pk(BR)),k,bad,sel:0})}CART={it:shuf(it),done:0};go('cart')}
function cartT(i){if(CART.done)return;CART.it[i].sel^=1;go('cart')}
function cartDone(){const c=CART;c.done=1;let good=0,wrong=0;c.it.forEach(x=>{if(x.bad&&x.sel){good++;acc(x.k,true)}else if(x.bad){wrong++;acc(x.k,false)}else if(x.sel){wrong++;acc(x.k,false)}});const r=good*4+(wrong==0?6:0);S.coins+=r;dmInc('correct',good);if(wrong==0)ach('cart');save();c.res={good,wrong,r};go('cart')}
SCR.cart=()=>{const c=CART;return `<div class="in"><h2>🧺 KERANJANG BELANJA</h2><div class="box"><small>Ada 2 produk bermasalah. Ketuk yang menurutmu BAHAYA, lalu tekan SELESAI.<br>📅 Hari ini: ${TODAY}</small></div><div class="cg">${c.it.map((x,i)=>{const ti=TAB.indexOf(x.k);return `<button class="cdn ${x.sel?'sel':''} ${c.done?(x.bad?'bd':'ok'):''}" onclick="cartT(${i})"><b>${x.p.e} ${x.p.name}</b><span class="chip">${TI[ti]} ${TN[ti]}</span><div>${x.p.pn[ti]}</div>${c.done?`<em>${x.bad?'⚠️ '+x.p.q[x.k]:'✅ Aman'}</em>`:''}</button>`}).join('')}</div>${c.done?`<div class="box">Benar: ${c.res.good}/2 \u00b7 Salah pilih: ${c.res.wrong} \u00b7 +${c.res.r} 🪙</div><button class="btn g" onclick="startCart()">ULANGI</button><button class="btn w" onclick="go('latihan')">KEMBALI</button>`:`<button class="btn g" onclick="cartDone()">✔ SELESAI (${c.it.filter(x=>x.sel).length} dipilih)</button><button class="btn w" onclick="go('latihan')">← KEMBALI</button>`}</div>`};
function nextF(){const k=pk(TAB),bad=Math.random()<.5,w=Math.min(4,1+(FAST.sc/5|0));EZ=0;FAST.q={p:mkProd(pk(ALLP),bad?k:null,w,Math.random()<.35?[k]:[],pk(BR)),k,bad};FAST.tmax=Math.max(4.5,9-FAST.sc*.15);FAST.tm=FAST.tmax;FAST.busy=0;FAST.fb=''}
function startFast(){if(FAST&&FAST.iv)clearInterval(FAST.iv);FAST={sc:0,me:3,fb:'',busy:0,nt:0,iv:0};nextF();go('fast');FAST.iv=setInterval(fastTick,100)}
function fastTick(){const f=FAST;if(!f||mode!='fast'){if(f)clearInterval(f.iv);return}if(f.busy){f.nt-=.1;if(f.nt<=0){if(f.me<=0){clearInterval(f.iv);fastEnd()}else{nextF();go('fast')}}return}f.tm-=.1;const e=$('#ftm');if(e)e.style.width=Math.max(0,f.tm/f.tmax*100)+'%';if(f.tm<=0)fAns(0,1)}
function fAns(a,to){const f=FAST;if(!f||f.busy)return;const q=f.q,ok=!to&&a==(q.bad?1:0);acc(q.k,ok);if(ok){f.sc++;dmInc('correct',1);f.fb='✔ Tepat! '+(q.bad?q.p.q[q.k]:'Aman.');sfx([660,880])}else{f.me--;vib(80);f.fb=(to?'⏰ Waktu habis! ':'✖ ')+(q.bad?q.p.q[q.k]:'Sebenarnya ini aman.');sfx([200,150])}f.busy=1;f.nt=1.5;go('fast')}
function fastEnd(){const f=FAST;S.hs=S.hs||{};const nb=f.sc>(S.hs.fast||0);if(nb)S.hs.fast=f.sc;const r=Math.min(40,Math.floor(f.sc/2)+(f.sc>0?3:0));S.coins+=r;if(f.sc>=10)ach('fast10');save();
 $('#ov').innerHTML=`<div class="ov"><div class="pop"><div class="box" style="background:#0e1a3d;color:#fff"><h2>⚡ SELESAI!</h2><br>Skor <b style="font-size:22px">${f.sc}</b>${nb?'<br>🎉 REKOR BARU!':''}<br><br>+${r} 🪙<br><br><button class="btn g" onclick="startFast()">MAIN LAGI</button><button class="btn w" onclick="$('#ov').innerHTML='';go('latihan')">KEMBALI</button></div></div></div>`}
SCR.fast=()=>{const f=FAST,q=f.q,ti=TAB.indexOf(q.k);return `<div class="in"><div class="bb"><span>${'❤️'.repeat(Math.max(0,f.me))||'💔'}</span><span style="margin-left:auto;font:700 16px Fredoka">Skor ${f.sc}</span></div><div class="qc"><div class="bb"><span class="chip">${TI[ti]} ${TN[ti]}</span><b style="flex:1;font-size:15px">${q.p.e} ${q.p.name}</b></div><small style="color:#a5d8ff">📅 Hari ini: ${TODAY}</small><div class="ct" style="margin-top:6px">${q.p.pn[ti]}</div><div class="bar" style="height:10px;margin-top:6px"><i id="ftm" style="width:${f.busy?0:f.tm/f.tmax*100}%;background:#fcc419"></i></div><div class="fbk">${f.fb||'Aman atau bahaya?'}</div><div class="qa"><button class="btn g" onclick="fAns(0)">✅ AMAN</button><button class="btn r" onclick="fAns(1)">⚠️ BAHAYA</button></div></div></div>`};
/* kuis */
function mini(){QZ={qs:shuf(QUIZ).slice(0,5),i:0,sc:0,lock:0};go('mini');qShow()}
function qShow(){const z=QZ,q=z.qs[z.i];$('#pn').innerHTML=`<div class="in"><h2>🧠 KUIS PANGAN AMAN</h2><div class="box"><small>Soal ${z.i+1}/5 \u00b7 Benar ${z.sc}</small><br><br><b style="font:700 17px Fredoka">${q.q}</b></div>${q.o.map((o,n)=>`<button class="btn w" style="font:700 14px Fredoka" onclick="qa(${n})">${o}</button>`).join('')}<div id="qf" class="box" style="display:none"></div></div>`;z.lock=0}
function qa(n){const z=QZ;if(z.lock)return;z.lock=1;const q=z.qs[z.i],ok=n==q.a;if(ok){z.sc++;sfx([660,880])}else{vib(80);sfx([200,150])}const f=$('#qf');f.style.display='block';f.innerHTML=`<span style="font:500 14px Fredoka">${ok?'✅ Benar!':'❌ Kurang tepat.'} ${q.e}</span><br><br><button class="btn g" onclick="qn()">${z.i<4?'LANJUT ▶':'SELESAI'}</button>`}
function qn(){const z=QZ;z.i++;if(z.i<5){qShow();return}const r=10+z.sc*3,h=z.sc==5&&S.hp<5;S.coins+=r;if(h)S.hp++;dmInc('quiz',1);if(z.sc==5)ach('quiz');save();$('#ov').innerHTML=`<div class="ov"><div class="pop"><div class="box" style="background:#0e1a3d;color:#fff"><h2>🧠 SELESAI!</h2><br>Nilai ${z.sc}/5<br><br>+${r} 🪙${h?'<br>+1 ❤️ nyawa tambahan!':''}<br><br><button class="btn g" onclick="$('#ov').innerHTML='';mini()">MAIN LAGI</button><button class="btn w" onclick="$('#ov').innerHTML='';go('latihan')">KEMBALI</button></div></div></div>`}
/* pengaturan */
function applyGfx(){const hm=S.gfx=='h';R.shadowMap.enabled=!hm;dl.castShadow=!hm;decoG.visible=!hm;clouds.forEach(c=>c.visible=!hm);document.documentElement.style.setProperty('--ts',S.ts||1);scene.traverse(o=>{if(o.material&&!Array.isArray(o.material))o.material.needsUpdate=true});rs()}
function setS(k,v){S[k]=v;save();applyGfx();go('set')}
SCR.set=()=>{const ch=(k,v,t)=>`<button class="tab ${(S[k]??(k=='gfx'?'n':k=='ts'?1:1))==v?'on':''}" onclick="setS('${k}',${typeof v=='string'?"'"+v+"'":v})">${t}</button>`;
 return `<div class="in"><h2>⚙ PENGATURAN</h2><div class="box"><b>Grafik</b><div class="tabs" style="margin-top:6px">${ch('gfx','n','NORMAL')}${ch('gfx','h','HEMAT')}</div><small>Hemat: tanpa bayangan dan hiasan, lebih ringan untuk HP lama.</small></div>
 <div class="box"><b>Ukuran teks</b><div class="tabs" style="margin-top:6px">${ch('ts',.9,'KECIL')}${ch('ts',1,'NORMAL')}${ch('ts',1.2,'BESAR')}</div></div>
 <div class="box"><b>Suara dan getar</b><div class="tabs" style="margin-top:6px">${ch('sx',1,'EFEK ON')}${ch('sx',0,'EFEK OFF')}</div><div class="tabs">${ch('vb',1,'GETAR ON')}${ch('vb',0,'GETAR OFF')}</div><button class="btn w" onclick="togM();go('set')">${mus?'🔊 MUSIK: NYALA':'🔇 MUSIK: MATI'}</button></div>
 <div class="box"><b>Progres</b><button class="btn w" style="margin-top:6px" onclick="exportSave()">💾 SIMPAN (KODE)</button><button class="btn w" onclick="importSave()">📥 MUAT KODE</button><button class="btn" onclick="S.tut=0;save();toast('Tutorial akan diulang di Stage 1')">🎓 ULANGI TUTORIAL</button><button class="btn" onclick="aboutBox()">ℹ TENTANG</button><button class="btn r" onclick="if(confirm('Hapus semua progres?')){localStorage.removeItem('sbpom3d');location.reload()}">RESET</button></div><button class="btn" onclick="go('menu')">⬅ MENU</button></div>`};
function exportSave(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#ov').innerHTML=`<div class="ov"><div class="pop"><div class="box" style="background:#0e1a3d;color:#fff"><h2>💾 KODE SIMPAN</h2><small>Salin dan simpan kode ini. Tempel lewat MUAT KODE di perangkat lain.</small><br><br><textarea readonly style="width:100%;height:140px;font-size:10px" onclick="this.select()">${c}</textarea><br><button class="btn w" onclick="$('#ov').innerHTML=''">TUTUP</button></div></div></div>`}
function importSave(){const c=prompt('Tempel kode simpan:');if(!c)return;try{Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(c.trim())))));save();location.reload()}catch(e){toast('Kode tidak valid')}}
function aboutBox(){$('#ov').innerHTML=`<div class="ov"><div class="pop"><div class="box" style="background:#0e1a3d;color:#fff;text-align:left"><h2>ℹ TENTANG</h2><br><span style="font:500 14px/1.5 Fredoka">SUPER BPOM adalah game edukasi untuk belajar membaca label produk. Contoh label, nomor izin edar, dan sertifikat halal di game ini disederhanakan dan bukan data produk sungguhan. Untuk informasi resmi, rujuk BPOM dan BPJPH. Logo BADAN POM milik lembaganya dan dipakai di sini sebagai tema.<br><br>Game ini tanpa iklan, tanpa pembelian, dan tanpa data pribadi. Progres hanya disimpan di perangkatmu.</span><br><br><button class="btn w" onclick="$('#ov').innerHTML=''">TUTUP</button></div></div></div>`}
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.btn,.tab,.tb1,.mb,.vb button,.cdn'))bp(520,.03)});
/* ===== efek menang / kalah ===== */
function sup2(){const fr=(n,c)=>sp(n,SUPER,10,1).replace('class="px"','class="px fr '+c+'"');
 return `<div class="scn"><div class="rays"></div><img class="lg" src="${LOGO}" alt=""><div class="ding">TING!</div><div class="fly"><div class="hop" style="position:relative;width:140px;height:180px">${fr('sup','a')}${fr('sup2','b')}</div></div>${[...Array(10)].map((_,i)=>`<span class="coin" style="left:${i*10+2}%;animation-delay:${(i%5)*.4}s">🪙</span>`).join('')}${['✨','⭐','✨','⭐'].map((c,i)=>`<span class="spk" style="left:${40+i*18}%;top:${14+(i%2)*38}%">${c}</span>`).join('')}</div>`}
function mon2(k,col){const OR={exp:'⏰',pack:'📦',comp:'🧪',izin:'🔎',halal:'❓',time:'⏳'},fr=(n,c)=>sp(n,{m:col,h:'#fde68a'},10).replace('class="px"','class="px fr '+c+'"');
 return `<div class="scn"><div class="rays dk"></div><div class="flash"></div><div class="mw"><div class="wob" style="position:relative;width:120px;height:110px">${fr('mon','a')}${fr('mon2','b')}<div class="orb"><span>${OR[k]}</span><span>${OR[k]}</span></div></div></div></div>`}
function tw(id,s){let i=0;const iv=setInterval(()=>{const el=$('#'+id);if(!el||i>s.length){clearInterval(iv);return}el.textContent=s.slice(0,++i);if(i%3==0)bp(900,.02)},35)}
/* ===== book ===== */
const ex=(ok,h)=>`<div class="ex ${ok?'ok':'bad'}"><b>${ok?'✅ AMAN':'⚠️ BERBAHAYA'}</b><br>${h}</div>`;
const PG=()=>[
`<h3>📖 BUKU INSPEKTUR CILIK</h3><br><center><span style="font-size:60px">🦸</span><br><br>Cek dulu, baru beli!</center>`,
`<h3>CARA MAIN</h3>🚶 Jalan ke kios Bu Ani atau Pak Budi<br>🔍 Tekan PERIKSA<br>📦 Putar kemasan 3D<br>📋 Buka 5 tab: Kemasan, Bahan, Izin, Tanggal, Halal<br>🛒 Beli yang aman<br>⏱ Waktu terbatas!<br>👹 Selesaikan 3 stage untuk BOSS bonus!`,
`<h3>5 YANG DICEK</h3>📦 <b>Kemasan:</b> segel rapat, tidak bocor atau menggembung. Cek bagian bawah!<br>🧪 <b>Bahan:</b> klaim cocok dengan bahan dan alergen.<br>🔎 <b>Izin:</b> BPOM RI MD/ML + 12 digit.<br>📅 <b>Tanggal:</b> bandingkan dengan hari ini.<br>🕌 <b>Halal:</b> ada nomor, masih berlaku.`,
`<h3>HINDARI!</h3>⚠️ Menggembung, bocor, lembap<br>⚠️ Tanggal sudah lewat<br>⚠️ Bahan samar atau bertentangan dengan klaim<br>⚠️ Izin salah (BP0M, bukan 12 digit, menyusul)<br>⚠️ Halal tanpa nomor, lewat, atau ada lard<br>⚠️ Pedagang bilang "tidak usah baca label"`,
`<h3>CONTOH</h3>${ex(1,`Segel rapat. Penyok 2 mm, tidak rembes.<br>EXP: ${fd(dd(200),0)}<br>BPOM RI MD 253110123456<br>HALAL BPJPH ID12345678901, s.d. ${fd(dd(400),0)}`)}${ex(0,`<mark>Tutup menggembung</mark><br>EXP: <mark>${fd(dd(-30),0)}</mark><br>BPOM RI MD <mark>25311012345</mark> (11 digit)<br>HALAL: <mark>dijamin produsen</mark>, tanpa nomor`)}`,
`<h3>PENGECOH AMAN</h3>✅ Penyok 2 mm, segel utuh<br>✅ Label bergeser 1 mm<br>✅ Produk impor (ML) dengan importir jelas<br>✅ Halal hampir habis tapi masih berlaku<br>✅ Format tanggal berbeda<br><br><b>BOSS:</b> jawab AMAN atau BAHAYA dengan cepat untuk menyerang monster ilegal!`,
`<h3>MODE LAIN</h3>🧺 Keranjang Belanja<br>⚡ Inspeksi Cepat<br>🧠 Kuis Pangan Aman<br>📅 Misi Harian dan hadiah login<br>🏅 Lencana dan album monster<br>🦉 Petunjuk (-5🪙), 1x per stage<br>👆 Ketuk gelembung pedagang untuk menjawab: cek dulu!`];
let bpg=0;
function book(p){if(p!=null)bpg=Math.max(0,Math.min(PG().length-1,p));const pg=PG();$('#bk').innerHTML=`<div class="ov" style="z-index:10"><div class="pop"><div class="bkw"><div class="paper pg">${pg[bpg]}</div><div class="bnav"><button class="tab" onclick="book(bpg-1)" ${bpg?'':'disabled'}>◀</button><span>${bpg+1}/${pg.length}</span><button class="tab" onclick="book(bpg+1)" ${bpg<pg.length-1?'':'disabled'}>▶</button></div><button class="btn w" style="margin-top:8px" onclick="$('#bk').innerHTML=''">✕ TUTUP BUKU</button></div></div></div>`;bp(660,.05)}
/* ===== music ===== */
let mus=1,ms=0;
const mf=n=>440*Math.pow(2,(n-69)/12);
function nt(n,d,ty,v){try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.value=mf(n);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const ML=[72,0,76,0,79,76,0,72,74,0,77,0,81,77,0,74,72,0,76,79,84,0,79,76,77,0,74,0,71,0,74,0],MB=[48,55,53,55,45,52,50,55];
function mloop(){const tense=(mode=='play'&&tOn&&tl<20)||mode=='boss';if(mus&&ac&&ac.state=='running'&&!document.hidden){const w=mode=='play'?S.lv/3|0:0,tr=[0,2,-3,3,-2][w],i=ms++,n=ML[i%32];if(n)nt(n+tr,.18,'square',.028);if(i%2==0)nt(MB[(i>>1)%8]+tr-12,.35,'triangle',.07);if(tense)nt(96,.06,'square',.015)}setTimeout(mloop,tense?140:210)}
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{ac=ac||new AudioContext();ac.resume()}));
function togM(){mus=mus?0:1;if(mode=='play')hud();else if(mode=='menu')go('menu')}
mloop();
/* ===== boot ===== */
theme(0);mkLevel();stalls.forEach((s,i)=>{s.es.material.map=stex(L.it[i].e,90,128,128)});mkPlayer();applyGfx();go('menu');dailyLogin();requestAnimationFrame(tick);
